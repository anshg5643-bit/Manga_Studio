{% macro gblock() %}
<div class="gwrap"><div data-gbtn></div>
  <button type="button" class="gfallback" data-gfallback hidden>
    <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.7 6c4.5-4.2 6.9-10.3 6.9-17.7z"/><path fill="#FBBC05" d="M10.5 28.7a14.5 14.5 0 0 1 0-9.4l-7.9-6.1a24 24 0 0 0 0 21.6l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.7-6c-2.2 1.5-5 2.3-8.2 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>
    Continue with Google</button>
</div>
<p class="small muted" data-gnote hidden style="margin:-4px 0 0">Google sign-in needs a Client ID. Paste it into <code>api_keys.txt</code> and restart.</p>
<div class="divline"><span>or use email</span></div>
{% endmacro %}

{% macro signup_form() %}
<form data-auth="signup" novalidate>
  <label class="f">Name<input name="name" autocomplete="name" placeholder="Your name"></label>
  <label class="f">Email (*)<input name="email" type="email" autocomplete="email" required placeholder="identifier@domain.com"></label>
  <label class="f">Password (*)<span class="eye"><input name="password" type="password" autocomplete="new-password" minlength="8" required placeholder="At least 8 characters"><button type="button" data-eye aria-label="Show password"><svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><use href="#i-eye"/></svg></button></span></label>
  <label class="f">Repeat password (*)<span class="eye"><input name="repeat" type="password" autocomplete="new-password" required placeholder="Repeat it"><button type="button" data-eye aria-label="Show password"><svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><use href="#i-eye"/></svg></button></span></label>
  <label class="chk terms"><input type="checkbox" name="terms" required><span>I have read and accept the <a href="/how-it-works#terms">Terms and Conditions</a></span></label>
  <label class="chk"><input type="checkbox" name="marketing"><span>Keep me informed about new features by email.</span></label>
  <p class="err" data-err role="alert" hidden></p>
  <button class="btn pale wide" type="submit"><span>Create Account</span><span aria-hidden="true">→</span></button>
</form>
{% endmacro %}

{% macro login_form() %}
<form data-auth="login" novalidate>
  <label class="f">Email (*)<input name="email" type="email" autocomplete="email" required placeholder="identifier@domain.com"></label>
  <label class="f">Password (*)<span class="eye"><input name="password" type="password" autocomplete="current-password" required placeholder="Your password"><button type="button" data-eye aria-label="Show password"><svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><use href="#i-eye"/></svg></button></span></label>
  <label class="chk"><input type="checkbox" name="remember" checked><span>Remember me</span></label>
  <p class="err" data-err role="alert" hidden></p>
  <button class="btn pale wide" type="submit"><span>Access Platform</span><span aria-hidden="true">→</span></button>
  <a class="link small" style="text-align:center" href="/reset-help">Reset My Password</a>
</form>
{% endmacro %}
